# Static part of the spec. Paths and component schemas are generated by
# `make generate` (cmd/openapi-gen) from `openapi:operation` and
# `openapi:schema` comments in internal/**. Do not edit openapi.yaml by hand.
openapi: 3.1.0
info:
  title: Ducksecrets API
  version: 0.1.0
  description: >-
    API of Ducksecrets. Every request that changes state must send the
    X-Ducksecrets-Request header (any value): together with SameSite=Strict
    cookies it blocks cross-site requests.
servers:
  - url: /api/v1
security:
  - session: []
tags:
  - { name: system, description: Health and version. }
  - { name: auth, description: Signing in and the caller's own account. }
  - { name: users, description: Accounts and roles (admins). }
  - { name: audit, description: Tamper-evident audit log. }
  - { name: projects, description: Secrets management projects. }
  - { name: secrets, description: Zero-trust secret store and rotation. }
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: ducksecrets_session
  parameters:
    CSRF:
      name: X-Ducksecrets-Request
      in: header
      required: true
      schema: { type: string }
      description: Any value. Required on every state-changing request.
  schemas:
    Error:
      type: object
      required: [error, message]
      properties:
        error: { type: string, description: 'Machine-readable code, e.g. not_found, conflict, csrf.' }
        message: { type: string }
