        - value
        - comment
        - created_at
        - created_by
      type: object
    SecretVersionList:
      properties:
        items:
          items:
            $ref: '#/components/schemas/SecretVersion'
          type: array
        total:
          type: integer
      required:
        - items
        - total
      type: object
    ServiceToken:
      properties:
        allowed_cidrs:
          type: string
        burned_at:
          format: date-time
          nullable: true
          type: string
        created_at:
          format: date-time
          type: string
        created_by:
          type: string
        environment_slug:
          type: string
        expires_at:
          format: date-time
          nullable: true
          type: string
        id:
          format: uuid
          type: string
        last_used_at:
          format: date-time
          nullable: true
          type: string
        name:
          type: string
        path:
          type: string
        permissions:
          type: string
        project_id:
          format: uuid
          type: string
        single_use:
          type: boolean
        token_prefix:
          type: string
      required:
        - id
        - name
        - token_prefix
        - project_id
        - environment_slug
        - path
        - permissions
        - allowed_cidrs
        - single_use
        - created_by
        - created_at
      type: object
    SetRotationPolicyRequest:
      additionalProperties: false
      properties:
        generator_config:
          type: string
        generator_type:
          type: string
        interval_seconds:
          type: integer
        verifier_config:
          type: string
        verifier_type:
          type: string
      required:
        - interval_seconds
        - generator_type
      type: object
    SetupRequest:
      additionalProperties: false
      properties:
        password:
          format: password
          type: string
        username:
          minLength: 1
          type: string
      required:
        - username
        - password
      type: object
    SetupStatus:
      properties:
        default_username:
          type: string
        min_password_length:
          type: integer
        needs_setup:
          type: boolean
      required:
        - needs_setup
        - default_username
        - min_password_length
      type: object
    ShareCreated:
      properties:
        created_at:
          format: date-time
          type: string
        expires_at:
          format: date-time
          type: string
        has_passphrase:
          type: boolean
        id:
          type: string
        max_views:
          type: integer
      required:
        - id
        - expires_at
        - max_views
        - has_passphrase
        - created_at
      type: object
    ShareMetadata:
      properties:
        created_at:
          format: date-time
          type: string
        expires_at:
          format: date-time
          type: string
        has_passphrase:
          type: boolean
        id:
          type: string
        max_views:
          type: integer
        passphrase_salt:
          type: string
        view_count:
          type: integer
      required:
        - id
        - expires_at
        - max_views
        - view_count
        - has_passphrase
        - created_at
      type: object
    ShareReveal:
      properties:
        burned:
          type: boolean
        ciphertext:
          type: string
        has_passphrase:
          type: boolean
        id:
          type: string
        max_views:
          type: integer
        nonce:
          type: string
        passphrase_salt:
          type: string
        view_count:
          type: integer
      required:
        - id
        - ciphertext
        - nonce
        - has_passphrase
        - view_count
        - max_views
        - burned
      type: object
    Site:
      properties:
        created_at:
          format: date-time
          type: string
        description:
          type: string
        id:
          format: uuid
          type: string
        last_seen_at:
          format: date-time
          nullable: true
          type: string
        name:
          type: string
        online:
          type: boolean
        project_id:
          format: uuid
          type: string
        token_prefix:
          type: string
        updated_at:
          format: date-time
          type: string
      required:
        - id
        - project_id
        - name
        - token_prefix
        - description
        - online
        - created_at
        - updated_at
      type: object
    SyncCredentialEnvRequest:
      additionalProperties: false
      properties:
        environment_slug:
          type: string
        overwrite:
          type: boolean
        path:
          type: string
        prefix:
          type: string
        project_id:
          type: string
      required:
        - project_id
        - environment_slug
      type: object
    SyncCredentialEnvResponse:
      properties:
        created:
          type: integer
        keys:
          items:
            type: string
          type: array
        updated:
          type: integer
      required:
        - created
        - updated
        - keys
      type: object
    TLSStatus:
      properties:
        cert_path:
          type: string
        fingerprint_sha256:
          type: string
        has_cert:
          type: boolean
        issuer:
          type: string
        key_path:
          type: string
        mode:
          type: string
        not_after:
          format: date-time
          type: string
        not_before:
          format: date-time
          type: string
        restart_required:
          type: boolean
        reverse_proxy_ready:
          type: boolean
        san_dns:
          items:
            type: string
          type: array
        san_ips:
          items:
            type: string
          type: array
        self_signed:
          type: boolean
        subject:
          type: string
        tls_active:
          type: boolean
        trusted_proxies_count:
          type: integer
      required:
        - tls_active
        - mode
        - has_cert
        - self_signed
        - san_dns
        - san_ips
        - trusted_proxies_count
        - reverse_proxy_ready
        - restart_required
      type: object
    TestDatabaseRequest:
      additionalProperties: false
      properties:
        postgres_url:
          minLength: 10
          type: string
      required:
        - postgres_url
      type: object
    TestDatabaseResponse:
      properties:
        message:
          type: string
        ok:
          type: boolean
      required:
        - ok
        - message
      type: object
    TestProviderRequest:
      properties:
        config:
          type: string
        engine:
          type: string
      required:
        - engine
        - config
      type: object
    TestProviderResponse:
      properties:
        message:
          type: string
        success:
          type: boolean
      required:
        - success
        - message
      type: object
    UpdateCredentialRequest:
      additionalProperties: false
      properties:
        description:
          maxLength: 500
          type: string
        environment_slug:
          type: string
        expires_at:
          format: date-time
          nullable: true
          type: string
        kind:
          enum:
            - ssh_key
            - tls_cert
            - oauth_api
            - login
          type: string
        name:
          maxLength: 160
          minLength: 1
          type: string
        payload:
          $ref: '#/components/schemas/CredentialPayload'
        project_id:
          nullable: true
          type: string
      type: object
    UpdateLicenseRequest:
      additionalProperties: false
      properties:
        token:
          minLength: 10
          type: string
      required:
        - token
      type: object
    UpdateProjectPolicyRequest:
      additionalProperties: false
      properties:
        can_admin:
          type: boolean
        can_edit_creds:
          type: boolean
        can_read:
          type: boolean
        can_view_creds:
          type: boolean
        can_write:
          type: boolean
        description:
          maxLength: 500
          type: string
        environment_slug:
          type: string
        expires_at:
          format: date-time
          nullable: true
          type: string
        starts_at:
          format: date-time
          nullable: true
          type: string
      type: object
    UpdateProjectRequest:
      additionalProperties: false
      properties:
        description:
          maxLength: 500
          type: string
        name:
          maxLength: 100
          minLength: 1
          type: string
      type: object
    UpdateRoleRequest:
      additionalProperties: false
      properties:
        description:
          type: string
        permissions:
          items:
            type: string
          type: array
      type: object
    UpdateSecretRequest:
      additionalProperties: false
      properties:
        comment:
          maxLength: 500
          type: string
        value:
          type: string
      type: object
    UpdateStatus:
      properties:
        asset_name:
          type: string
        current_version:
          type: string
        error:
          type: string
        expected_sha256:
          type: string
        latest_version:
          type: string
        published_at:
          type: string
        release_url:
          type: string
        repo:
          type: string
        update_available:
          type: boolean
      required:
        - repo
        - current_version
        - latest_version
        - update_available
      type: object
    UpdateUserRequest:
      additionalProperties: false
      properties:
        disabled:
          type: boolean
        display_name:
          type: string
        role:
          type: string
      type: object
    UploadTLSRequest:
      additionalProperties: false
      properties:
        cert_pem:
          minLength: 32
          type: string
        key_pem:
          minLength: 32
          type: string
      required:
        - cert_pem
        - key_pem
      type: object
    User:
      properties:
        created_at:
          format: date-time
          type: string
        disabled:
          type: boolean
        display_name:
          type: string
        id:
          format: uuid
          type: string
        last_login_at:
          format: date-time
          type:
            - string
            - "null"
        role:
          description: 'Role name: admin and user always exist.'
          type: string
        source:
          description: 'pam: a system account; its password and role come from the host.'
          enum:
            - local
            - pam
          type: string
        updated_at:
          format: date-time
          type: string
        username:
          type: string
      required:
        - id
        - username
        - display_name
        - source
        - role
        - disabled
        - created_at
        - updated_at
        - last_login_at
      type: object
  securitySchemes:
    session:
      in: cookie
      name: ducksecrets_session
      type: apiKey
info:
  description: 'API of Ducksecrets. Every request that changes state must send the X-Ducksecrets-Request header (any value): together with SameSite=Strict cookies it blocks cross-site requests.'
  title: Ducksecrets API
  version: 0.1.0
openapi: 3.1.0
paths:
  /audit:
    get:
      description: |-
        Newest first.

        Requires the permission audit.read.
      operationId: listAudit
      parameters:
        - in: query
          name: page
          schema:
            default: 1
            type: integer
        - in: query
          name: per_page
          schema:
            default: 50
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditEvents'
          description: Events
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not authenticated
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not allowed (role, grant or missing CSRF header)
      summary: Audit log
      tags:
        - audit
      x-permission: audit.read
  /audit/verify:
    get:
      description: |-
        Recomputes every hash; slow on large logs.

        Requires the permission audit.read.
      operationId: verifyAudit
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditVerification'
          description: Result
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not authenticated
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not allowed (role, grant or missing CSRF header)
      summary: Verify the audit chain
      tags:
        - audit
      x-permission: audit.read
  /auth/login:
    post:
      description: Sets the ducksecrets_session cookie (HttpOnly, SameSite=Strict).
      operationId: login
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: Signed in
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not authenticated
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not allowed (role, grant or missing CSRF header)
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Too many attempts
      security: []
      summary: Sign in
      tags:
        - auth
  /auth/logout:
    post:
      operationId: logout
      parameters:
        - $ref: '#/components/parameters/CSRF'
      responses:
        "204":
          description: Signed out
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not authenticated
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not allowed (role, grant or missing CSRF header)
      summary: Sign out
      tags:
        - auth
  /auth/me:
    get:
      operationId: me
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: Me
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not authenticated
      summary: The signed-in user and what they may do
      tags:
        - auth
  /auth/me/password:
    put:
      description: Ends every other session of the user.
      operationId: changePassword
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      responses:
        "204":
          description: Changed
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not authenticated
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not allowed (role, grant or missing CSRF header)
      summary: Change my password
      tags:
        - auth
  /auth/setup:
    get:
      description: Reports whether the instance has zero users and expects initial administrator creation on first login.
      operationId: setupStatus
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupStatus'
          description: Setup status
      security: []
      summary: Check first-run administrator setup status
      tags:
        - auth
    post:
      description: Creates the initial administrator account when no users exist yet and signs the operator in.
      operationId: completeSetup
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: Administrator created and signed in
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid request
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not allowed (role, grant or missing CSRF header)
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Conflicts with the current state
      security: []
      summary: Complete first-run administrator setup
      tags:
        - auth
  /credentials:
    get:
      description: |-
        Returns all credentials accessible to the caller (global vault and accessible projects). Payloads are omitted unless reveal=1.

        Requires the permission secrets.read.
      operationId: listCredentials
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialList'
          description: Credentials list
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not authenticated
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not allowed (role, grant or missing CSRF header)
      summary: List credentials
      tags:
        - credentials
      x-permission: secrets.read
    post:
      description: |-
        Encrypts and stores a structured credential (SSH key, TLS certificate, API/OAuth key, or Login).

        Requires the permission secrets.write.
      operationId: createCredential
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCredentialRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credential'
          description: Credential created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not authenticated
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not allowed (role, grant or missing CSRF header)
      summary: Create credential
      tags:
        - credentials
      x-permission: secrets.write
  /credentials/{cred_id}:
    delete:
      description: |-
        Permanently deletes a stored credential.

        Requires the permission secrets.write.
      operationId: deleteCredential
      parameters:
        - in: path
          name: cred_id
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/CSRF'
      responses:
        "204":
          description: Credential deleted
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not authenticated
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not allowed (role, grant or missing CSRF header)
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not found
      summary: Delete credential
      tags:
        - credentials
      x-permission: secrets.write
    get:
      description: |-
        Retrieves and decrypts a single credential by ID.

        Requires the permission secrets.read.
      operationId: getCredential
      parameters:
        - in: path
          name: cred_id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credential'
          description: Decrypted credential
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not authenticated
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not allowed (role, grant or missing CSRF header)
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not found
      summary: Get credential
      tags:
        - credentials
      x-permission: secrets.read
    patch:
      description: |-
        Updates metadata, project/environment binding, or encrypted payload of a credential.

        Requires the permission secrets.write.
      operationId: updateCredential
      parameters:
        - in: path
          name: cred_id
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCredentialRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credential'
          description: Credential updated
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not authenticated
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not allowed (role, grant or missing CSRF header)
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not found
      summary: Update credential
      tags:
        - credentials
      x-permission: secrets.write
  /credentials/{cred_id}/sync-env:
    post:
      description: |-
        Projects a structured credential's fields (e.g. CLIENT_ID, CLIENT_SECRET, PRIVATE_KEY) as encrypted environment secrets inside a target project and environment.

        Requires the permission secrets.write.
      operationId: syncCredentialToEnv
      parameters:
        - in: path
          name: cred_id
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncCredentialEnvRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncCredentialEnvResponse'
          description: Sync summary
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not authenticated
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not allowed (role, grant or missing CSRF header)
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not found
      summary: Sync credential fields into environment secrets
      tags:
        - credentials
      x-permission: secrets.write
  /credentials/generate-ssh:
    post:
      description: |-
        Generates a fresh cryptographic SSH keypair (Ed25519, RSA-4096, or ECDSA-P256) in OpenSSH format.

        Requires the permission secrets.write.
      operationId: generateSSHKeypair
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateSSHKeyRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateSSHKeyResponse'
          description: Generated SSH keypair
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not authenticated
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not allowed (role, grant or missing CSRF header)
      summary: Generate SSH keypair
      tags:
        - credentials
      x-permission: secrets.write
  /download/ducksecrets:
    get:
      description: Serves the compiled ducksecrets CLI executable for the server's platform.
      operationId: downloadCLI
      responses:
        "200":
          content:
            application/octet-stream:
              schema:
                format: binary
                type: string
          description: Binary stream
      security: []
      summary: Download ducksecrets CLI binary
      tags:
        - download
  /grants:
    get:
      description: You see the grants of objects you may write.
