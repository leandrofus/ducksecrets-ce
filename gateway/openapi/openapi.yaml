      summary: Download active public TLS / CA certificate PEM
      tags:
        - system
  /system/tls/self-signed:
    post:
      description: |-
        Generates a fresh self-signed ECDSA P-256 certificate (optionally with extra DNS/IP SANs) and hot-swaps it live.

        Requires the permission system.manage.
      operationId: regenerateSelfSignedTLS
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateSelfSignedTLSRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TLSStatus'
          description: Updated TLS status
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not authenticated
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not allowed (role, grant or missing CSRF header)
      summary: Generate or regenerate self-signed TLS certificate
      tags:
        - system
      x-permission: system.manage
  /system/update:
    get:
      description: |-
        Checks the latest release tag in the public repository (leandrofus/ducksecrets-ce) against the running server version.

        Requires the permission system.manage.
      operationId: getUpdateStatus
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateStatus'
          description: Update status check result
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not authenticated
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not allowed (role, grant or missing CSRF header)
      summary: Check for public release updates
      tags:
        - system
      x-permission: system.manage
    post:
      description: |-
        Downloads the matching ducksecretsd release binary from leandrofus/ducksecrets-ce, verifies its SHA256SUMS digest, and atomically replaces the executable on disk.

        Requires the permission system.manage.
      operationId: applySystemUpdate
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyUpdateRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplyUpdateResponse'
          description: Self-update result
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not authenticated
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not allowed (role, grant or missing CSRF header)
      summary: Apply verified self-update from public release
      tags:
        - system
      x-permission: system.manage
