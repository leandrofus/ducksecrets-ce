# Example Nginx reverse proxy configuration for DuckSecrets.
# DuckSecrets supports:
#   1. HTTP upstream (recommended with DUCKSECRETS_TLS_MODE=off + DUCKSECRETS_TRUSTED_PROXIES=127.0.0.1/8,::1/128)
#   2. HTTPS upstream (proxy_pass https://127.0.0.1:5179; with self-signed or custom cert)

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl http2;
    server_name secrets.example.com;

    ssl_certificate     /etc/letsencrypt/live/secrets.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/secrets.example.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:5179;
        proxy_http_version 1.1;

        # Real client IP and HTTPS detection (honored via DUCKSECRETS_TRUSTED_PROXIES)
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        # WebSocket support for live UI updates (/api/v1/ws) and site reverse tunnels
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}
