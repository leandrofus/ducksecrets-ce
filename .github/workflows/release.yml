name: Release

# Runs on a tag like v0.2.0: tag.yml creates it (and starts this workflow)
# when a version bump reaches main; pushing one by hand works too. Builds
# static binaries, native packages (.deb/.rpm/.pkg.tar.zst/.msi), and multi-arch images.
on:
  push:
    tags: ['v*']
  workflow_dispatch: # tag.yml, on the new tag

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    # a manual run on a branch must not publish anything
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum
      - uses: oven-sh/setup-bun@v2
      - name: Web UI
        run: cd web && bun install --frozen-lockfile && bun run build
      - name: Tests
        working-directory: gateway
        run: go test -count=1 ./...
      - name: Install MSI toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends wixl
      - name: Static binaries & packages (.deb, .rpm, .pkg.tar.zst, .msi)
        env:
          LICENSE_PUBLIC_KEY: ${{ secrets.DUCKSECRETS_LICENSE_PUBLIC_KEY }}
        run: make dist packages VERSION="$GITHUB_REF_NAME" LICENSE_PUBLIC_KEY="$LICENSE_PUBLIC_KEY"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files="dist/ducksecrets-* dist/ducksecretsd-* dist/SHA256SUMS"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" $files --clobber
          else
            gh release create "$GITHUB_REF_NAME" $files --title "Ducksecrets ${GITHUB_REF_NAME#v}" --generate-notes --verify-tag
          fi

  docker:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check Docker Hub credentials
        id: hub
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::DOCKERHUB_TOKEN secret is not set; skipping Docker Hub push to system4us/ducksecrets."
          fi
      - uses: docker/setup-qemu-action@v3
        if: steps.hub.outputs.enabled == 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.hub.outputs.enabled == 'true'
      - uses: docker/login-action@v3
        if: steps.hub.outputs.enabled == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'system4us' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        if: steps.hub.outputs.enabled == 'true'
        uses: docker/metadata-action@v5
        with:
          images: system4us/ducksecrets
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        if: steps.hub.outputs.enabled == 'true'
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            LICENSE_PUBLIC_KEY=${{ secrets.DUCKSECRETS_LICENSE_PUBLIC_KEY }}
      - name: Sync Docker Hub description & overview
        if: steps.hub.outputs.enabled == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || 'system4us' }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request

          user = os.environ["DOCKERHUB_USERNAME"]
          pat = os.environ["DOCKERHUB_TOKEN"]
          repo = os.environ["GITHUB_REPO"]

          req = urllib.request.Request(
              "https://hub.docker.com/v2/users/login",
              data=json.dumps({"username": user, "password": pat}).encode(),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          jwt = json.loads(urllib.request.urlopen(req, timeout=20).read().decode())["token"]

          with open("README.md", "r", encoding="utf-8") as f:
              readme = f.read()
          base = f"https://github.com/{repo}/blob/main/"
          readme = re.sub(r'\]\((?!https?://|#)([^)]+)\)', lambda m: f']({base}{m.group(1)})', readme)

          payload = {
              "description": "Self-hosted secrets manager, dynamic credentials, rotation & private tunnels in one container.",
              "full_description": readme,
          }
          patch = urllib.request.Request(
              "https://hub.docker.com/v2/repositories/system4us/ducksecrets/",
              data=json.dumps(payload).encode(),
              headers={"Content-Type": "application/json", "Authorization": f"Bearer {jwt}"},
              method="PATCH",
          )
          with urllib.request.urlopen(patch, timeout=20) as resp:
              print("Docker Hub metadata synced:", resp.status)
          PY
